services:

  minio:
    image: pgsty/silo:${MINIO_VERSION_TAG}

    container_name: minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data

    command: server --address ":9000" --console-address ":9001" /data

    networks: 
      - data-network 


  minio-init:
    image: pgsty/mc:${MC_VERSION_TAG}

    container_name: minio-init

    depends_on:
      - minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000
      $$MINIO_ROOT_USER
      $$MINIO_ROOT_PASSWORD;
      do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;

      mc mb --ignore-existing local/raw;
      mc mb --ignore-existing local/processed;

      echo 'MinIO buckets initialized.';
      mc ls local;
      "
    
    networks: 
      - data-network 


  postgres:
    image: postgres:17

    container_name: postgres

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    networks: 
      - data-network 


  spark-master:
    build: 
      context: ./spark
      dockerfile: Dockerfile
    
    image: project_spark:latest

    container_name: spark-master

    hostname: spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    ports:
      - "8080:8080"
      - "7077:7077"

    networks:
      - data-network 

    volumes:
      - ./:/opt/project
  

  spark-worker-1:
    image: project_spark:latest

    container_name: spark-worker-1

    hostname: spark-worker-1

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    
    depends_on:
      - spark-master
    
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
    
    networks: 
      - data-network 
    
    volumes:
      - ./:/opt/project


  spark-worker-2:
    image: project_spark:latest

    container_name: spark-worker-2

    hostname: spark-worker-2

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    
    depends_on:
      - spark-master
    
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
    
    networks: 
      - data-network 

    volumes:
      - ./:/opt/project


  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: project_airflow:3.3.2
    container_name: airflow
    hostname: airflow
    command: standalone

    ports:
      - "8081:8080"

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

      PYTHONPATH: /opt/airflow/project

    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - airflow_data:/opt/airflow/state
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      - spark-master
      - minio
      - postgres

    networks: 
      - data-network 

    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
  airflow_data:


networks:
  data-network:
    driver: bridge